name: Strategy discovery lab
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Fixed comma-separated listed stocks; blank uses existing discovery'
        default: ''
        type: string
      evaluation_start:
        description: 'Inclusive evaluation start'
        default: '2026-10-01'
        type: string
      evaluation_end:
        description: 'Exclusive evaluation end'
        default: '2026-11-01'
        type: string
      limit:
        description: 'Candidates per discovery screen'
        default: '10'
        type: string
      allocation:
        description: 'USD stock allocation ceiling'
        default: '300'
        type: choice
        options: ['250','300']
      top_n:
        description: 'Stocks-in-play maximum symbols per decision time'
        default: '20'
        type: string
      minimum_rvol:
        description: 'Minimum historical same-time cumulative RVOL'
        default: '2'
        type: string
      holdout_start:
        description: 'Optional chronological holdout boundary YYYY-MM-DD'
        default: ''
        type: string
      catalysts_csv:
        description: 'Optional historical catalyst CSV path already in this branch'
        default: ''
        type: string
      require_catalyst:
        description: 'Require a timestamped historical catalyst'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Regression tests
        run: python -m pytest -q
      - name: Acquire regular, premarket and separate SPY history
        env:
          SYMBOLS: ${{ inputs.symbols }}
          START: ${{ inputs.evaluation_start }}
          END: ${{ inputs.evaluation_end }}
          LIMIT: ${{ inputs.limit }}
          ALLOCATION: ${{ inputs.allocation }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m penny_lab.sip_research acquire --symbols "$SYMBOLS" --start "$START" --end "$END" --limit "$LIMIT" --min-reference 12 --allocation "$ALLOCATION" --feed sip
      - name: Run components, blends, selectors, cost stress and chronological comparisons
        env:
          TOP_N: ${{ inputs.top_n }}
          RVOL: ${{ inputs.minimum_rvol }}
          HOLDOUT: ${{ inputs.holdout_start }}
          CATALYSTS: ${{ inputs.catalysts_csv }}
          REQUIRE: ${{ inputs.require_catalyst }}
        run: |
          flags=()
          if [ "$REQUIRE" = "true" ]; then flags+=(--require-catalyst); fi
          python -m penny_lab.sip_research --top-n "$TOP_N" --minimum-rvol "$RVOL" --holdout-start "$HOLDOUT" --catalysts "$CATALYSTS" "${flags[@]}"
      - name: Preserve source snapshots and research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocks-in-play-${{ github.run_id }}
          path: results/research-v2/
          if-no-files-found: warn
          retention-days: 14
