name: Uptrend filter comparison
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Required comma-separated listed USD stock symbols for one-minute scalping'
        required: true
        type: string
      allocation:
        description: 'USD per-position allocation ceiling'
        default: '300'
        type: choice
        options: ['250','300']
permissions:
  contents: read
jobs:
  stochastic-scalper:
    name: One-minute stochastic scalper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Compile every Python module
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: Run one-minute stochastic scalper at normal and doubled costs
        env:
          SYMBOLS: ${{ inputs.symbols }}
          ALLOCATION: ${{ inputs.allocation }}
        run: python -m penny_lab.stochastic_scalper --symbols "$SYMBOLS" --allocation "$ALLOCATION"
      - name: Preserve minute history, coverage, trades and equity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-scalper-${{ github.run_id }}
          path: results/stochastic-scalper/
          if-no-files-found: warn
          retention-days: 7
