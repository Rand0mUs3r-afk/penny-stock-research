name: Research diagnostics v2
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional fixed Yahoo symbols; blank uses current under-25 screens'
        default: ''
        type: string
      evaluation_start:
        description: 'YYYY-MM-DD; blank defaults to 14 calendar days before end, warmup downloaded separately'
        default: ''
        type: string
      evaluation_end:
        description: 'Exclusive YYYY-MM-DD; blank is current UTC date'
        default: ''
        type: string
      limit:
        description: 'Candidates per current screen, 1-25'
        default: '10'
        type: string
      min_reference:
        description: 'Minimum valid historical prefixes out of prior 20 sessions; 12 is a separate relaxed experiment'
        default: '12'
        type: choice
        options: ['12','20']
      allocation:
        description: 'USD position allocation ceiling per independent portfolio'
        default: '300'
        type: choice
        options: ['250','300']
      feed:
        description: 'Explicit Alpaca fallback feed'
        default: 'sip'
        type: choice
        options: ['sip','iex']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Regression tests
        run: python -m pytest -q
      - name: Coverage-first portfolios and detailed summary
        env:
          SYMBOLS: ${{ inputs.symbols }}
          START: ${{ inputs.evaluation_start }}
          END: ${{ inputs.evaluation_end }}
          LIMIT: ${{ inputs.limit }}
          REFERENCE: ${{ inputs.min_reference }}
          ALLOCATION: ${{ inputs.allocation }}
          FEED: ${{ inputs.feed }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m penny_lab.research_v2 --symbols "$SYMBOLS" --start "$START" --end "$END" --limit "$LIMIT" --min-reference "$REFERENCE" --allocation "$ALLOCATION" --feed "$FEED"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v2-${{ github.run_id }}
          path: results/research-v2/
          if-no-files-found: warn
          retention-days: 14
