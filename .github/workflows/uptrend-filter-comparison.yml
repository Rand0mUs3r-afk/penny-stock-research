name: Uptrend filter comparison
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Evaluation years; an additional 12-month signal warmup is downloaded'
        default: '10'
        type: choice
        options: ['1','3','5','10','15']
      allocation:
        description: 'USD per-asset allocation ceiling in all cases'
        default: '300'
        type: choice
        options: ['250','300']
permissions:
  contents: read
jobs:
  monthly-trend:
    name: Monthly trend, 45-day variant and buy-and-hold comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: Run monthly trend research with cost and chronological comparisons
        env:
          YEARS: ${{ inputs.years }}
          ALLOCATION: ${{ inputs.allocation }}
        run: python -m penny_lab.monthly_trend --years "$YEARS" --allocation "$ALLOCATION"
      - name: Preserve daily data, signals, costs and portfolio comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-trend-${{ github.run_id }}
          path: results/monthly-trend/
          if-no-files-found: warn
          retention-days: 14
