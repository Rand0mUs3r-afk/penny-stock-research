name: Uptrend filter comparison
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Evaluation years, plus 12-month signal warmup'
        default: '10'
        type: choice
        options: ['1','3','5','10','15']
      allocation:
        description: 'Combined per-ticker allocation ceiling across both strategies'
        default: '300'
        type: choice
        options: ['250','300']
      trend_weight:
        description: 'Monthly-trend allocation percent; buy-and-hold gets the remainder'
        default: '50'
        type: string
      cost_multiple:
        description: 'One cost assumption for this single shared-account run'
        default: '1'
        type: choice
        options: ['0','1','2']
permissions:
  contents: read
jobs:
  shared-portfolio:
    name: One shared USD 2000 portfolio with exact trade-date ledger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: Run one continuous shared portfolio, not independent comparison accounts
        env:
          YEARS: ${{ inputs.years }}
          ALLOCATION: ${{ inputs.allocation }}
          WEIGHT: ${{ inputs.trend_weight }}
          COST: ${{ inputs.cost_multiple }}
        run: python -m penny_lab.shared_monthly --years "$YEARS" --allocation "$ALLOCATION" --trend-weight "$WEIGHT" --cost-multiple "$COST"
      - name: Preserve shared-account trades, entry/exit dates and ticker holding days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-portfolio-${{ github.run_id }}
          path: results/shared-monthly/
          if-no-files-found: warn
          retention-days: 14
