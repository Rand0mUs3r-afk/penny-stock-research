name: Research diagnostics v2
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional fixed Yahoo symbols; blank scans stocks priced $1-$35 inclusive'
        default: ''
        type: string
      evaluation_start:
        description: 'Inclusive evaluation start; warmup is downloaded separately'
        default: '2026-10-01'
        type: string
      evaluation_end:
        description: 'Exclusive end; 2026-11-01 includes all of October 31'
        default: '2026-11-01'
        type: string
      limit:
        description: 'Candidates per current screen, 1-25'
        default: '10'
        type: string
      min_reference:
        description: 'Minimum valid historical prefixes in previous 20 sessions'
        default: '12'
        type: choice
        options: ['12','20']
      allocation:
        description: 'USD position allocation ceiling'
        default: '300'
        type: choice
        options: ['250','300']
      feed:
        description: 'Explicit Alpaca fallback feed'
        default: 'sip'
        type: choice
        options: ['sip','iex']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Regression tests
        run: python -m pytest -q
      - name: Stocks 1 to 35, prior-high targets, no RR gate, same-day exits
        env:
          SYMBOLS: ${{ inputs.symbols }}
          START: ${{ inputs.evaluation_start }}
          END: ${{ inputs.evaluation_end }}
          LIMIT: ${{ inputs.limit }}
          REFERENCE: ${{ inputs.min_reference }}
          ALLOCATION: ${{ inputs.allocation }}
          FEED: ${{ inputs.feed }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m penny_lab.range_runner --symbols "$SYMBOLS" --start "$START" --end "$END" --limit "$LIMIT" --min-reference "$REFERENCE" --allocation "$ALLOCATION" --feed "$FEED"
      - name: Publish costs and execution timing
        if: always()
        run: PYTHONPATH=src python -m penny_lab.execution_report
      - name: Publish historical targets and planned net RR
        if: always()
        run: PYTHONPATH=src python -m penny_lab.range_runner --report-only
      - name: Snapshot replay and cost stress tests
        if: ${{ success() }}
        run: python -m penny_lab.validation
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v2-${{ github.run_id }}
          path: results/research-v2/
          if-no-files-found: warn
          retention-days: 14
