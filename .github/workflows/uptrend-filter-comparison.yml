name: Uptrend filter comparison
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated listed USD stock symbols'
        required: true
        type: string
      allocation:
        description: 'USD per-position allocation ceiling'
        default: '300'
        type: choice
        options: ['250','300']
      history_days:
        description: 'Calendar-day history window, greater than holding period'
        default: '90'
        type: string
      hold_days:
        description: 'Maximum holding duration in calendar days, 1-45'
        default: '45'
        type: string
      feed:
        description: 'Alpaca historical data feed'
        default: 'sip'
        type: choice
        options: ['sip','iex']
      fast_exits:
        description: 'Keep the old fast stochastic exits in addition to stops/deadline'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  extended-holding:
    name: Stochastic entries with up to 45-day holding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: Run overnight holding and starting/final equity summaries
        env:
          SYMBOLS: ${{ inputs.symbols }}
          ALLOCATION: ${{ inputs.allocation }}
          HISTORY: ${{ inputs.history_days }}
          HOLD: ${{ inputs.hold_days }}
          FEED: ${{ inputs.feed }}
          FAST: ${{ inputs.fast_exits }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          flags=()
          if [ "$FAST" = "true" ]; then flags+=(--fast-exits); fi
          python -m penny_lab.extended_holding --symbols "$SYMBOLS" --allocation "$ALLOCATION" --history-days "$HISTORY" --hold-days "$HOLD" --feed "$FEED" "${flags[@]}"
      - name: Preserve data, equity, closed trades and open positions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-holding-${{ github.run_id }}
          path: results/extended-holding/
          if-no-files-found: warn
          retention-days: 14
