name: Uptrend filter comparison
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Diversified USD ETF proxies, not the old low-price stock screen'
        default: 'SPY,EFA,IEF,VNQ,DBC'
        type: string
      start:
        description: 'Inclusive evaluation start; earlier warmup downloaded separately'
        default: '2010-01-01'
        type: string
      end:
        description: 'Exclusive end YYYY-MM-DD; blank uses today'
        default: ''
        type: string
      boundary:
        description: 'Optional chronological earlier/later boundary'
        default: ''
        type: string
      spread_bps:
        description: 'Explicit spread assumption; not optimized for profit'
        default: '50'
        type: string
      slippage_bps:
        description: 'Explicit slippage assumption'
        default: '25'
        type: string
permissions:
  contents: read
jobs:
  monthly-trend:
    name: Monthly trend, buy-and-hold and constrained 45-day comparison
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' 'yfinance>=0.2.65,<1' 'pandas-market-calendars>=4,<6'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: Evaluate monthly trend and benchmarks
        env:
          SYMBOLS: ${{ inputs.symbols }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          BOUNDARY: ${{ inputs.boundary }}
          SPREAD: ${{ inputs.spread_bps }}
          SLIPPAGE: ${{ inputs.slippage_bps }}
        run: |
          flags=()
          if [ -n "$END" ]; then flags+=(--end "$END"); fi
          python -m penny_lab.monthly_trend --symbols "$SYMBOLS" --start "$START" --boundary "$BOUNDARY" --spread-bps "$SPREAD" --slippage-bps "$SLIPPAGE" "${flags[@]}"
      - name: Preserve prices, comparisons, orders, equity and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-trend-${{ github.run_id }}
          path: results/monthly-trend/
          if-no-files-found: warn
          retention-days: 14
