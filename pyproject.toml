[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-stock-research"
version = "0.1.0"
description = "Backtesting-only foundations for low-price stock research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
news = ["yfinance>=0.2.54,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
penny-lab = "penny_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
